services:
  - type: web
    name: gmail-app
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: production
      - key: PAYPAL_API_URL
        value: https://api-m.paypal.com
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_LEMONSQUEEZY_STARTER_MONTHLY_VARIANT_ID
        sync: false
      - key: NEXT_PUBLIC_LEMONSQUEEZY_STARTER_ANNUAL_VARIANT_ID
        sync: false
      - key: NEXT_PUBLIC_LEMONSQUEEZY_PRO_MONTHLY_VARIANT_ID
        sync: false
      - key: NEXT_PUBLIC_LEMONSQUEEZY_PRO_ANNUAL_VARIANT_ID
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://xeloflow.com
